[project]
name = "game-room"
version = "0.2.0"
description = "PettingZoo environments for tabletop games"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pettingzoo", "reinforcement-learning", "multi-agent", "card-games"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Austin Poor", email = "45295232+a-poor@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = ["pettingzoo>=1.24.3,<2", "gymnasium>=1.0,<2", "numpy>=2.1"]

[project.urls]
Repository = "https://github.com/a-poor/game-room"
Issues = "https://github.com/a-poor/game-room/issues"
Documentation = "https://github.com/a-poor/game-room#readme"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**", "tests/**"]
